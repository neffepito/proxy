name: Update ChatGPT Voice IPs

on:
  schedule:
    # Run every Monday at 04:00 UTC (12:00 CST)
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and generate ruleset
        run: |
          python3 scripts/update_voice_ips.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add Shadowrocket/Filter/AI/ChatGPT-Voice.list ruleset/ChatGPT-Voice.list
          if git diff --staged --quiet; then
            echo "No changes detected in ruleset."
          else
            git commit -m "chore(ruleset): auto-update ChatGPT Voice IP list"
            git push
          fi
